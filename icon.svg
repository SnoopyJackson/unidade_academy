<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FFC400"/>
    </linearGradient>
  </defs>
  <!-- Full background (no rounded corners - let the OS mask it) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- U letter for Unidade - centered in safe zone (inner 80%) -->
  <text x="256" y="290" font-family="Arial, Helvetica, sans-serif" font-size="240" font-weight="bold" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle">U</text>
  <!-- Bottom text - within safe zone -->
  <text x="256" y="390" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">UNIDADE</text>
</svg>
